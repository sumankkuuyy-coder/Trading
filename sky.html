<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sky-Auth | Minimal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap');

        :root {
            --primary-green: #00c853;
            --primary-red: #ff5252;
            --white: #ffffff;
            --glass: rgba(255, 255, 255, 0.98);
        }

        body {
            font-family: 'Outfit', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }

        .auth-container {
            width: 350px;
            background: var(--glass);
            padding: 40px 30px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.08);
            text-align: center;
            border: 1px solid #fff;
        }

        .logo-area {
            width: 60px; height: 60px;
            background: #fff;
            margin: 0 auto 20px;
            border-radius: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 15px rgba(0,0,0,0.05);
            color: var(--primary-green);
            font-size: 28px;
        }

        h2 { margin: 0; font-size: 24px; color: #333; }
        p { color: #777; margin: 8px 0 25px; font-size: 14px; }

        .input-box { position: relative; margin-bottom: 18px; }
        .input-box i {
            position: absolute; left: 15px; top: 50%;
            transform: translateY(-50%); color: #ccc;
        }

        input {
            width: 100%; padding: 14px 14px 14px 45px;
            border-radius: 12px; border: 2px solid #eee;
            background: #fbfbfb; font-size: 15px;
            outline: none; box-sizing: border-box; transition: 0.3s;
        }

        input:focus { border-color: var(--primary-green); background: #fff; }

        .btn {
            width: 100%; padding: 15px; border-radius: 12px;
            border: none; font-size: 16px; font-weight: 700;
            cursor: pointer; transition: 0.3s; margin-top: 10px;
            background: var(--primary-green); color: white;
            box-shadow: 0 5px 15px rgba(0, 200, 83, 0.2);
        }

        .btn:hover { transform: translateY(-2px); filter: brightness(1.1); }

        .toggle-btn { margin-top: 20px; font-size: 14px; color: #666; }
        .toggle-btn b { color: var(--primary-red); cursor: pointer; }

        #notification {
            position: fixed; top: 20px; right: 20px; padding: 12px 20px;
            border-radius: 8px; color: white; display: none; z-index: 100;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="logo-area"><i class="fas fa-bolt"></i></div>
        <h2 id="title">Sign In</h2>
        <p id="desc">Enter mobile & password to continue</p>

        <div class="input-box">
            <i class="fas fa-phone"></i>
            <input type="number" id="mobile" placeholder="Mobile Number">
        </div>

        <div class="input-box">
            <i class="fas fa-lock"></i>
            <input type="password" id="password" placeholder="Password">
        </div>

        <button class="btn" onclick="handleAction()" id="submit-btn">PROCEED</button>

        <div class="toggle-btn">
            <span id="toggle-text">Don't have an account?</span>
            <b onclick="toggleUI()" id="toggle-link">Sign Up</b>
        </div>
    </div>

    <div id="notification"></div>

    <script>
        let isLogin = true;
        const WORKER_URL = "YOUR_WORKER_URL_HERE";

        function toggleUI() {
            isLogin = !isLogin;
            document.getElementById('title').innerText = isLogin ? "Sign In" : "Sign Up";
            document.getElementById('desc').innerText = isLogin ? "Enter mobile & password to continue" : "Create a new account quickly";
            document.getElementById('submit-btn').innerText = isLogin ? "PROCEED" : "CREATE ACCOUNT";
            document.getElementById('toggle-text').innerText = isLogin ? "Don't have an account?" : "Already have an account?";
            document.getElementById('toggle-link').innerText = isLogin ? "Sign Up" : "Sign In";
        }

        async function handleAction() {
            const mobile = document.getElementById('mobile').value;
            const password = document.getElementById('password').value;

            if (!mobile || !password) {
                notify("Details bhariye!", "#ff5252");
                return;
            }

            const path = isLogin ? "/api/user/login" : "/api/user/signup";
            
            try {
                notify("Wait...", "#4facfe");
                const res = await fetch(WORKER_URL + path, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ mobile, password })
                });
                const data = await res.json();

                if (data.success) {
                    notify("Success!", "#00c853");
                    if(isLogin) {
                        localStorage.setItem('user', JSON.stringify(data.user));
                        // Redirect here
                    } else {
                        toggleUI();
                    }
                } else {
                    notify(data.error || "Galti!", "#ff5252");
                }
            } catch (e) {
                notify("Server Error!", "#ff5252");
            }
        }

        function notify(msg, color) {
            const n = document.getElementById('notification');
            n.innerText = msg; n.style.background = color;
            n.style.display = 'block';
            setTimeout(() => n.style.display = 'none', 3000);
        }
    </script>
</body>
</html>
