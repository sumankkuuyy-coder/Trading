<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Payment Gateway</title>
    <!-- Font Awesome for Secure Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #e3f2fd; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        
        .card { background: white; padding: 25px; border-radius: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); width: 100%; max-width: 380px; text-align: center; }

        /* Timer */
        #timer { font-size: 24px; font-weight: 800; color: #2e7d32; margin-bottom: 10px; }
        .timer-red { color: #d32f2f !important; }

        /* Satrangi Border QR */
        .qr-wrapper { position: relative; width: 240px; height: 240px; margin: 0 auto 15px; padding: 6px; border-radius: 15px; background: linear-gradient(45deg, red, orange, yellow, green, blue, indigo, violet); background-size: 400% 400%; animation: rainbow 5s linear infinite; }
        @keyframes rainbow { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .qr-img { width: 100%; height: 100%; background: white; border-radius: 10px; }

        /* Icons Row */
        .icons-row { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .icons-row img { height: 35px; width: 35px; object-fit: contain; transition: 0.3s; }

        /* Inputs */
        .input-group { text-align: left; margin-bottom: 12px; }
        label { font-size: 11px; font-weight: bold; color: #666; margin-left: 5px; }
        input { width: 100%; padding: 12px; margin-top: 5px; border: 2px solid #ddd; border-radius: 10px; font-size: 16px; box-sizing: border-box; outline: none; transition: 0.3s; }
        #amount { border-color: #bbdefb; }
        #utr { border-color: #c8e6c9; }
        input:focus { border-color: #2575fc; box-shadow: 0 0 8px rgba(37,117,252,0.2); }

        /* Button */
        button { width: 100%; padding: 15px; background: linear-gradient(135deg, #6a11cb, #2575fc); color: white; border: none; border-radius: 12px; font-size: 17px; font-weight: bold; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 15px rgba(37,117,252,0.3); }

        /* Pending Screen */
        #pending-screen { display: none; }
        .spinner { border: 6px solid #f3f3f3; border-top: 6px solid #2575fc; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .details-box { background: #f8f9fa; padding: 15px; border-radius: 12px; text-align: left; margin-top: 20px; border: 1px solid #eee; }
        .details-box p { margin: 10px 0; font-size: 14px; color: #333; display: flex; justify-content: space-between; border-bottom: 1px dashed #ddd; padding-bottom: 5px; }
        
        .secure-tag { font-size: 12px; color: #777; margin-top: 15px; }
        .secure-tag i { color: #28a745; }
    </style>
</head>
<body>

    <!-- Payment UI -->
    <div class="card" id="payment-ui">
        <div id="timer">05:00</div>
        
        <div class="qr-wrapper">
            <img src="https://i.ibb.co/VYMqp1yt/IMG-20260512-110132.jpg" class="qr-img" id="qr">
        </div>

        <!-- 5 Requested Icons -->
        <div class="icons-row">
            <img src="https://i.ibb.co/RG9h4vz3/download-1.png" alt="PhonePe">
            <img src="https://i.ibb.co/kfnZKRb/download-3.png" alt="Paytm">
            <img src="https://i.ibb.co/PZ4cF6qw/images-7.png" alt="Google Pay">
            <img src="https://i.ibb.co/WNhd67Wj/images-6.png" alt="Navi">
            <img src="https://i.ibb.co/h1dkv33P/download-2.png" alt="BharatPe">
        </div>

        <div class="input-group">
            <label>ENTER AMOUNT</label>
            <input type="number" id="amount" placeholder="₹ 0.00">
        </div>

        <div class="input-group">
            <label>12-DIGIT UTR NUMBER</label>
            <input type="text" id="utr" placeholder="Enter Reference No." maxlength="12">
        </div>

        <button onclick="submitToWorker()">SUBMIT PAYMENT</button>
        
        <div class="secure-tag">
            <i class="fa-solid fa-shield-halved"></i> Secure SSL Encrypted
        </div>
    </div>

    <!-- Pending Screen UI -->
    <div class="card" id="pending-screen">
        <div class="spinner"></div>
        <h2 style="color: #2575fc; margin-bottom: 5px;">Payment Pending</h2>
        <p style="font-size: 13px; color: #666;">Verification in progress...</p>
        
        <div class="details-box" id="info">
            <!-- Data will be injected here -->
        </div>

        <div class="secure-tag" style="margin-top: 25px;">
            <i class="fa-solid fa-lock"></i> Do not close this window
        </div>
    </div>

    <script>
        // 1. Timer Logic (5 Min)
        let timeLeft = 300;
        const timerEl = document.getElementById('timer');
        const countdown = setInterval(() => {
            let m = Math.floor(timeLeft / 60);
            let s = timeLeft % 60;
            timerEl.innerText = `0${m}:${s < 10 ? '0'+s : s}`;
            if (timeLeft < 60) timerEl.classList.add('timer-red');
            if (timeLeft <= 0) {
                clearInterval(countdown);
                document.getElementById('qr').style.filter = "blur(8px) grayscale(1)";
                alert("QR Expired!");
            }
            timeLeft--;
        }, 1000);

        // 2. Submit & Pending Logic
        async function submitToWorker() {
            const amt = document.getElementById('amount').value;
            const utrNo = document.getElementById('utr').value;
            const txnId = "TXN" + Math.floor(Math.random() * 99999999);
            const date = new Date().toLocaleString();

            if (!amt || utrNo.length < 6) {
                alert("Please enter valid Amount and UTR!");
                return;
            }

            // UI Switch
            document.getElementById('payment-ui').style.display = 'none';
            document.getElementById('pending-screen').style.display = 'block';

            // Inject Details
            document.getElementById('info').innerHTML = `
                <p><span>Amount:</span> <b>₹${amt}</b></p>
                <p><span>UTR No:</span> <b>${utrNo}</b></p>
                <p><span>Order ID:</span> <b>${txnId}</b></p>
                <p><span>Status:</span> <b style="color:#f39c12">PENDING</b></p>
                <p><span>Date:</span> <b>${date}</b></p>
            `;

            // Data Send to Worker
            try {
                await fetch('YOUR_WORKER_URL', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ amount: amt, utr: utrNo, txnId: txnId, date: date })
                });
            } catch (err) {
                console.log("Worker Send failed - Link update karein");
            }
        }
    </script>
</body>
</html>
